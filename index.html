<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TACTIC — A Platformer About Tourette Syndrome</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="game" width="1280" height="720"></canvas>

      <div id="hud">
        <div id="hud-left">
          <div id="level-label">Stage 1</div>
        </div>
        <div id="hud-right">
          <button id="mute-btn" title="Mute Music">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M4 9v6h4l5 5V4L8 9H4z"
                fill="currentColor"
              />
              <path
                class="mute-slash"
                d="M2 2L22 22"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button id="restart-btn" title="Restart From Checkpoint">⟲</button>
        </div>
      </div>

      <div id="overlay" class="hidden">
        <div id="overlay-box">
          <h1 id="overlay-title">TACTIC</h1>
          <p id="overlay-text"></p>
          <button id="overlay-btn" class="menu-btn">Start</button>
        </div>
      </div>

      <div id="controls-hint">
        ←/→ Move &nbsp;|&nbsp; Space/↑ Jump &nbsp;|&nbsp; Esc Menu
      </div>
    </div>

    <!-- <script src="js/levels.js"></script>
  <script src="js/game.js"></script> -->
    <script src="js/levels.js"></script>
    <script src="js/level-select.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
